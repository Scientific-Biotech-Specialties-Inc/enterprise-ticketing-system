name: deploy-ticketing-prod

# Production deployment workflow for the Enterprise Ticketing System.
# Automatically builds container images (frontend, gateway, and all 9 backend microservices)
# and pushes to GHCR, rolling them into Azure Container Apps.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RG: rg-capstone
  REGISTRY_ORG: ghcr.io/scientific-biotech-specialties-inc

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy-gateway:
    name: Build & Deploy Ticketing Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ticketing-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.gateway
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/ticketing-gateway:${{ github.sha }}
            ${{ env.REGISTRY_ORG }}/ticketing-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll ticketing-gateway in Azure
        continue-on-error: true
        run: |
          az containerapp update \
            --name ticketing-gateway \
            --resource-group "${{ env.RG }}" \
            --image "${{ env.REGISTRY_ORG }}/ticketing-gateway:${{ github.sha }}"

  deploy-web:
    name: Build & Deploy Ticketing Web (Employee Portal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ticketing-web (Employee Mode)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/web
          file: ./frontend/web/Dockerfile
          build-args: |
            VITE_BASE_PATH=/ticketing/
            VITE_APP_MODE=employee
            VITE_CUSTOMER_PORTAL_URL=${{ vars.CUSTOMER_PORTAL_URL }}
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/ticketing-web:${{ github.sha }}
            ${{ env.REGISTRY_ORG }}/ticketing-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll ticketing-web in Azure
        continue-on-error: true
        run: |
          az containerapp update \
            --name ticketing-web \
            --resource-group "${{ env.RG }}" \
            --image "${{ env.REGISTRY_ORG }}/ticketing-web:${{ github.sha }}"

  deploy-customer-web:
    name: Build & Deploy Customer Web (Customer Portal)
    # Separate container app and URL from the employee portal. Customers authenticate only against
    # customer-service and never reach the central auth module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push customer-ticketing-web (Customer Mode)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/web
          file: ./frontend/web/Dockerfile
          build-args: |
            VITE_BASE_PATH=/
            VITE_APP_MODE=customer
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/customer-ticketing-web:${{ github.sha }}
            ${{ env.REGISTRY_ORG }}/customer-ticketing-web:latest
          cache-from: type=gha,scope=customer-web
          cache-to: type=gha,mode=max,scope=customer-web

      - name: Azure login (OIDC)
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll customer-ticketing-web in Azure
        continue-on-error: true
        run: |
          az containerapp update \
            --name customer-ticketing-web \
            --resource-group "${{ env.RG }}" \
            --image "${{ env.REGISTRY_ORG }}/customer-ticketing-web:${{ github.sha }}"

  deploy-services:
    name: Build & Deploy Microservice
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ticket-service
            context: ./services/ticket-service
            file: ./services/ticket-service/Dockerfile
          - name: employee-service
            context: ./services/employee-service
            file: ./services/employee-service/Dockerfile
          - name: customer-service
            context: ./services/customer-service
            file: ./services/customer-service/Dockerfile
          - name: configuration-service
            context: ./services/configuration-service
            file: ./services/configuration-service/Dockerfile
          - name: attachment-service
            context: ./services/attachment-service
            file: ./services/attachment-service/Dockerfile
          - name: messaging-service
            context: ./services/messaging-service
            file: ./services/messaging-service/Dockerfile
          - name: analytics-service
            context: ./services/analytics-service
            file: ./services/analytics-service/Dockerfile
          - name: notification-service
            context: ./services/notification-service
            file: ./services/notification-service/Dockerfile
          - name: ai-service
            context: ./services/AI-service
            file: ./services/AI-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy shared ticketing-auth package into build context
        run: |
          rm -rf "${{ matrix.context }}/packages/ticketing-auth"
          mkdir -p "${{ matrix.context }}/packages"
          cp -r ./packages/ticketing-auth "${{ matrix.context }}/packages/ticketing-auth"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY_ORG }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll ${{ matrix.name }} in Azure
        continue-on-error: true
        run: |
          az containerapp update \
            --name ${{ matrix.name }} \
            --resource-group "${{ env.RG }}" \
            --image "${{ env.REGISTRY_ORG }}/${{ matrix.name }}:${{ github.sha }}"
