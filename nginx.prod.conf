# Production Nginx Gateway Configuration
# Handles domain-based routing, HTTP/2, compression, and client cache tuning.

# 1. Gzip Compression Settings
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.code
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

# Helper variable for mapping connections for WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker embedded DNS resolver for dynamic upstream resolution
resolver 127.0.0.11 valid=30s ipv6=off;

# 2. Server Block for Central SSO Portal (sso.company.local)
server {
    listen 80;
    server_name sso.company.local;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self';" always;

    client_max_body_size 20M;

    set $sso_upstream http://web-interface:5000;
    set $ticket_upstream http://ticket-service:8000;

    # Static assets client caching headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        proxy_pass $sso_upstream;
    }

    # Default proxy to SSO frontend / auth-service
    location / {
        proxy_pass $sso_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API endpoints gateway
    location /api/ {
        proxy_pass $ticket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 3. Server Block for Employee Ticketing System (ticketing.company.local)
server {
    listen 80;
    server_name ticketing.company.local ticketing.* localhost;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self';" always;

    client_max_body_size 25M;

    set $employee_web http://ticketing_web:5005;
    set $reverb_ws http://reverb:6001;
    set $msg_reverb_ws http://messaging-reverb:6002;

    # Static assets client caching headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        proxy_pass $employee_web;
    }

    # Employee Frontend React SPA
    location / {
        proxy_pass $employee_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API requests forwarded to Laravel Ticket API
    location /api/ticketing/ticket/ {
        rewrite ^/api/ticketing/ticket/(.*)$ /api/$1 break;
        proxy_pass http://ticket-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API requests forwarded to Laravel Attachment API
    location /api/ticketing/attachment/ {
        rewrite ^/api/ticketing/attachment/(.*)$ /api/$1 break;
        proxy_pass http://attachment-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API requests forwarded to Laravel Messaging API
    location /api/ticketing/messaging/ {
        rewrite ^/api/ticketing/messaging/(.*)$ /api/$1 break;
        proxy_pass http://messaging-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API requests forwarded to Laravel Analytics API (feedback, CSAT). Spec 0034: the verified token must reach the service.
    location /api/ticketing/analytics/ {
        rewrite ^/api/ticketing/analytics/(.*)$ /api/$1 break;
        proxy_pass http://analytics-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # API requests forwarded to Laravel AI API (chat, conversations, KB). Spec 0034: the verified token must reach the service.
    location /api/ticketing/ai/ {
        rewrite ^/api/ticketing/ai/(.*)$ /api/$1 break;
        proxy_pass http://ai-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # API requests forwarded to Laravel Employee API
    location /api/ticketing/employee/ {
        rewrite ^/api/ticketing/employee/(.*)$ /api/$1 break;
        proxy_pass http://employee-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API requests forwarded to Laravel Configuration API
    location /api/ticketing/configuration/ {
        rewrite ^/api/ticketing/configuration/(.*)$ /api/$1 break;
        proxy_pass http://configuration-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static file requests forwarded to Attachment Service storage
    location /storage/ {
        proxy_pass http://attachment-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket Laravel Reverb Gateway
    location /app/ {
        proxy_pass $reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket Laravel Messaging Reverb Gateway
    location /messaging-app/ {
        proxy_pass $msg_reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

