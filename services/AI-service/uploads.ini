; Knowledge base articles accept files up to 10 MB (KbArticleController: max:10240).
; PHP's defaults (8M per request, 2M per file) rejected anything over 2 MB first.
; Installed into conf.d by the ai-service command in docker-compose.yml, because
; "php -d" flags do not reach the process that artisan serve starts.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
