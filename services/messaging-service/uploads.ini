; Chat messages can carry files, which messaging-service forwards to attachment-service.
; PHP's defaults (8M per request, 2M per file) silently dropped larger uploads, and a body
; over post_max_size lost the message text too ("Please provide either a message or an
; attachment"). Keep these in step with services/attachment-service/uploads.ini.
; The superadmin file limits are still enforced by attachment-service.
upload_max_filesize = 50M
post_max_size = 50M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
