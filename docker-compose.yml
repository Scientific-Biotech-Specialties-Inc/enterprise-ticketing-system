services:

  db:
    image: mysql:8
    container_name: capstone-db
    restart: always
    command: --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "33061:3306"
    networks:
      - default
      - shared-capstone-network
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: capstone-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  reverb:
    build:
      context: ./services/customer-service
    container_name: capstone-reverb
    volumes:
      - ./services/customer-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - customer-service-vendor:/var/www/vendor
    restart: always
    environment:
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6001
    ports:
      - "6001:6001"
    command: >
      sh -lc "php artisan reverb:start --host=0.0.0.0 --port=6001"
    depends_on:
      - redis

  customer-service:
    build:
      context: ./services/customer-service
    container_name: customer-service
    volumes:
      - ./services/customer-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - customer-service-vendor:/var/www/vendor
    ports:
      - "8001:8000"
    networks:
      - default
      - shared-capstone-network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: "Enterprise Ticketing System"
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && php -d upload_max_filesize=20M -d post_max_size=25M artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started

  customer-service-queue:
    build:
      context: ./services/customer-service
    container_name: customer-service-queue
    volumes:
      - ./services/customer-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - customer-service-vendor:/var/www/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    command: >
      sh -lc "php artisan queue:work redis --sleep=1 --tries=3 --timeout=90"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started
    restart: unless-stopped

  ticketing-gateway:
    image: nginx:alpine
    container_name: ticketing-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.gateway.conf:/etc/nginx/conf.d/default.conf
    networks:
      - default
      - shared-capstone-network
    depends_on:
      - customer-service
      - ticket-service
      - employee-service
      - configuration-service


  # Runs the Laravel scheduler for ticket-service (audit log purge, forecasts, SLA checks).
  # Without this container the jobs listed by `php artisan schedule:list` never execute.
  ticket-scheduler:
    # Shares the image already built for ticket-service, so no second build is needed.
    image: ${COMPOSE_PROJECT_NAME:-enterprise-ticketing-system}-ticket-service
    build:
      context: ./services/ticket-service
    container_name: ticket-scheduler
    volumes:
      - ./services/ticket-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - ticket-service-vendor:/var/www/vendor
    networks:
      - default
      - shared-capstone-network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    command: >
      sh -lc "while [ ! -f vendor/autoload.php ] || [ ! -f .env ]; do sleep 5; done && php artisan schedule:work"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ticket-service:
        condition: service_started

  ticket-service:
    build:
      context: ./services/ticket-service
    container_name: ticket-service
    volumes:
      - ./services/ticket-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - ticket-service-vendor:/var/www/vendor
    ports:
      - "8002:8000"
    networks:
      - default
      - shared-capstone-network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && php -d variables_order=EGPCS -d upload_max_filesize=20M -d post_max_size=25M artisan serve --no-reload --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started



  ticket-service-queue:
    build:
      context: ./services/ticket-service
    container_name: ticket-service-queue
    volumes:
      - ./services/ticket-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - ticket-service-vendor:/var/www/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    command: >
      sh -lc "php artisan queue:work redis --sleep=1 --tries=3 --timeout=90"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started
    restart: unless-stopped

  employee-service:
    build:
      context: ./services/employee-service
    container_name: employee-service
    volumes:
      - ./services/employee-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - employee-service-vendor:/var/www/vendor
    ports:
      - "8008:8000"
    networks:
      - default
      - shared-capstone-network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && rm -f bootstrap/cache/*.php && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && php -d upload_max_filesize=20M -d post_max_size=25M artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started

  notification-service:
    build:
      context: ./services/notification-service
    container_name: notification-service
    volumes:
      - ./services/notification-service:/var/www
    ports:
      - "8003:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  analytics-service:
    build:
      context: ./services/analytics-service
    container_name: analytics-service
    restart: always
    volumes:
      - ./services/analytics-service:/var/www
      # Shared token verification package used by AuthenticateSubsystem (spec 0034).
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      # Keep vendor/ off the Windows bind mount. Without this every request booted Laravel over the host
      # filesystem (about 24 s), so /api/csat-stats never answered within any timeout (spec 0031 AC-16).
      - analytics-service-vendor:/var/www/vendor
    # The image ships vendor/ without dev packages, but the bind mounted bootstrap cache expects them,
    # so install the full set into the volume on first start. OPcache is turned on for the CLI because
    # artisan serve runs the built in server under the CLI, where it is off by default.
    command: sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && if [ ! -d vendor/nunomaduro/collision ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && echo opcache.enable_cli=1 > /usr/local/etc/php/conf.d/zz-opcache-cli.ini && php -d variables_order=EGPCS artisan serve --no-reload --host=0.0.0.0 --port=8000"
    ports:
      - "8004:8000"
    networks:
      - default
      - shared-capstone-network
    environment:
      # artisan serve is single threaded by default; let a slow request not block the next one.
      PHP_CLI_SERVER_WORKERS: 4
      # The api throttle middleware touches the cache on every request; Redis keeps that off the bind mount.
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  configuration-service:
    build:
      context: ./services/configuration-service
    container_name: configuration-service
    restart: always
    volumes:
      - ./services/configuration-service:/var/www
      - configuration-service-vendor:/var/www/vendor
      # Shared token verification package used by AuthenticateSubsystem (spec 0034).
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
    ports:
      - "8009:8000"
    networks:
      - default
      - shared-capstone-network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && php artisan migrate --force && php -d variables_order=EGPCS artisan serve --no-reload --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  ai-service:
    build:
      context: ./services/AI-service
    container_name: ai-service
    volumes:
      - ./services/AI-service:/var/www
      - ai-service-vendor:/var/www/vendor
      # Shared token verification package used by AuthenticateSubsystem (spec 0034).
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
    ports:
      - "8005:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    networks:
      - default
      - shared-capstone-network
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started


  clamav:
    image: clamav/clamav:stable
    container_name: capstone-clamav
    restart: always
    ports:
      - "3310:3310"
    networks:
      - default
      - shared-capstone-network

  attachment-service:
    build:
      context: ./services/attachment-service
    container_name: attachment-service
    volumes:
      - ./services/attachment-service:/var/www
      - attachment-service-vendor:/var/www/vendor
    ports:
      - "8006:8000"
    networks:
      - default
      - shared-capstone-network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && if [ -f uploads.ini ]; then cp uploads.ini /usr/local/etc/php/conf.d/uploads.ini; fi && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi && php artisan storage:link --force && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && php -d upload_max_filesize=50M -d post_max_size=50M artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      clamav:
        condition: service_started

  mongodb:
    image: mongo:7.0.14
    container_name: capstone-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    networks:
      - default
      - shared-capstone-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  messaging-reverb:
    build:
      context: ./services/messaging-service
    container_name: capstone-messaging-reverb
    volumes:
      - ./services/messaging-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - messaging-service-vendor:/var/www/vendor
    restart: always
    environment:
      REVERB_APP_ID: messaging-local
      REVERB_APP_KEY: messaging-local-key
      REVERB_APP_SECRET: messaging-local-secret
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6002
    ports:
      - "6002:6002"
    command: >
      sh -lc "php artisan reverb:start --host=0.0.0.0 --port=6002"
    depends_on:
      - redis
    networks:
      - default
      - shared-capstone-network

  messaging-service:
    build:
      context: ./services/messaging-service
    container_name: messaging-service
    volumes:
      - ./services/messaging-service:/var/www
      - ./packages/ticketing-auth:/var/www/packages/ticketing-auth
      - messaging-service-vendor:/var/www/vendor
    ports:
      - "8007:8000"
    networks:
      - default
      - shared-capstone-network
    env_file:
      - ./services/messaging-service/.env
    environment:
      DB_CONNECTION: mongodb
      PASSPORT_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: messaging-local
      REVERB_APP_KEY: messaging-local-key
      REVERB_APP_SECRET: messaging-local-secret
      REVERB_HOST: messaging-reverb
      REVERB_PORT: 6002
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist --optimize-autoloader; fi && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      messaging-reverb:
        condition: service_started

  ticketing-frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      target: build
    container_name: ticketing_web
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    ports:
      - "5005:5005"
    networks:
      - default
      - shared-capstone-network
    environment:
      VITE_BASE_PATH: "/ticketing/"
      VITE_APP_MODE: "employee"
      VITE_PORT: 5005
      VITE_CUSTOMER_SERVICE_URL: "http://customer-service:8000"
      VITE_TICKET_SERVICE_URL: "http://ticket-service:8000"
      VITE_ATTACHMENT_SERVICE_URL: "http://attachment-service:8000"
      VITE_MESSAGING_SERVICE_URL: "http://messaging-service:8000"
      VITE_AI_SERVICE_URL: "http://ai-service:8000"
      VITE_ANALYTICS_SERVICE_URL: "http://analytics-service:8000"
      VITE_CONFIGURATION_SERVICE_URL: "http://configuration-service:8000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5005"
    restart: always

  customer-ticketing-frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      target: build
    container_name: customer_ticketing_web
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    ports:
      - "5006:5006"
    networks:
      - default
      - shared-capstone-network
    environment:
      VITE_BASE_PATH: "/customer-ticketing/"
      VITE_APP_MODE: "customer"
      VITE_PORT: 5006
      VITE_CUSTOMER_SERVICE_URL: "http://customer-service:8000"
      VITE_TICKET_SERVICE_URL: "http://ticket-service:8000"
      VITE_ATTACHMENT_SERVICE_URL: "http://attachment-service:8000"
      VITE_MESSAGING_SERVICE_URL: "http://messaging-service:8000"
      VITE_AI_SERVICE_URL: "http://ai-service:8000"
      VITE_ANALYTICS_SERVICE_URL: "http://analytics-service:8000"
      VITE_CONFIGURATION_SERVICE_URL: "http://configuration-service:8000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5006"
    restart: always

volumes:
  db_data:
  redis_data:
  mongodb_data:
  customer-service-vendor:
  ticket-service-vendor:
  auth-service-vendor:
  attachment-service-vendor:
  messaging-service-vendor:
  employee-service-vendor:
  ai-service-vendor:
  configuration-service-vendor:
  analytics-service-vendor:

networks:
  default:
    driver: bridge
  shared-capstone-network:
    external: true
  ai-ticketing-network:
    external: true
